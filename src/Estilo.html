<style>
  :root {
    --cor: #8b7bff;
    --cor-suave: rgba(139,123,255,.12);
    --texto: #1c2233;
    --texto-2: #5b6478;
    --linha: #e3e6ee;
    --fundo: #ffffff;
    --fundo-2: #f6f7fb;
    --erro: #d6415f;
    --ok: #1f9e74;
    --raio: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texto); background: var(--fundo); font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; }

  .topo { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; border-bottom: 1px solid var(--linha); }
  .topo img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
  .topo .marca-inicial { width: 36px; height: 36px; border-radius: 8px; background: var(--cor); color: #fff;
    display: grid; place-items: center; font-weight: 700; }
  .topo strong { font-size: 15px; }

  .conteudo { flex: 1; overflow-y: auto; padding: 16px 2px; }
  .rodape { border-top: 1px solid var(--linha); padding-top: 10px; font-size: 12px; color: var(--texto-2);
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-2); margin: 18px 0 10px; }
  h2:first-child { margin-top: 0; }
  .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .campo label { font-weight: 600; font-size: 13px; }
  .campo small { color: var(--texto-2); font-size: 12px; }
  .campo input, .campo select, .campo textarea { font: inherit; padding: 9px 10px; border: 1px solid var(--linha);
    border-radius: 8px; background: #fff; color: var(--texto); outline: none; width: 100%; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--cor); box-shadow: 0 0 0 3px var(--cor-suave); }
  .campo.erro input, .campo.erro select, .campo.erro textarea { border-color: var(--erro); }
  .linha-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .linha-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .com-sufixo { position: relative; }
  .com-sufixo span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--texto-2); }

  .acoes { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  .btn-principal { background: var(--cor); color: #fff; }
  .btn-principal:disabled { opacity: .6; cursor: wait; }
  .btn-secundario { background: var(--fundo-2); color: var(--texto); border: 1px solid var(--linha); }
  .btn-perigo { background: var(--erro); color: #fff; }

  .aviso { font-size: 12px; color: var(--erro); margin-top: 4px; }
  .dica { background: var(--fundo-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--texto-2); }
  .vazio { text-align: center; color: var(--texto-2); padding: 32px 0; }
  .carregando { text-align: center; color: var(--texto-2); padding: 32px 0; }

  /* Janela própria de confirmação e aviso (nunca alert/confirm do navegador) */
  .sobre { position: fixed; inset: 0; background: rgba(20,24,38,.45); display: none; align-items: center;
    justify-content: center; padding: 16px; z-index: 50; }
  .sobre.aberta { display: flex; }
  .caixa { background: #fff; border-radius: 12px; max-width: 420px; width: 100%; padding: 20px; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .caixa h3 { font-size: 16px; margin-bottom: 6px; }
  .caixa p { color: var(--texto-2); margin-bottom: 4px; }
  .caixa .codigo { font-size: 11px; color: var(--texto-2); margin-top: 10px; }
  .caixa .acoes { padding-top: 16px; }

  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ok); color: #fff; padding: 9px 16px; border-radius: 8px; font-weight: 600;
    transition: all .2s ease; pointer-events: none; z-index: 60; }
  .toast.visivel { opacity: 1; transform: translateX(-50%); }
</style>
